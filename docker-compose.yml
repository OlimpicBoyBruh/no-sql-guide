# Локальные СУБД для ручных экспериментов (redis-cli, mongosh, cqlsh) и запуска examples.
# Тестам compose не нужен: они поднимают контейнеры сами через Testcontainers.
name: nosql-guide

services:
  redis:
    image: redis:8.2
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    volumes: [redis-data:/data]

  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    # replica set из одной ноды: нужен для транзакций и Change Streams
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # инициализирует replica set при первом запуске, дальше просто проверяет статус
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      retries: 20
    volumes: [mongo-data:/data/db]

  cassandra:
    image: cassandra:5.0
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
      CASSANDRA_CLUSTER_NAME: nosql-guide
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 15s
      retries: 20
    volumes: [cassandra-data:/var/lib/cassandra]

volumes:
  redis-data:
  mongo-data:
  cassandra-data:
